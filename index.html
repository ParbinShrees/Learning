<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="clock-container">

        <div class="clock-card">

            <p class="label">DIGITAL CLOCK</p>

            <p id="greeting" class="greeting">Welcome</p>

            <h1 id="time">00:00:00</h1>

            <p id="date" class="date">Loading date...</p>

            <div class="info">

                <p id="timezone">
                    Timezone: Loading...
                </p>

                <p id="status">
                    Clock is starting...
                </p>

            </div>

            <div class="controls">

                <button id="formatToggle">
                    12 Hour
                </button>

                <button id="secondsToggle">
                    Hide Seconds
                </button>

            </div>

            <div class="shortcuts">

                <p>Keyboard Shortcuts</p>

                <span>T</span>
                Toggle 12/24 hour

                <span>S</span>
                Toggle seconds

            </div>

        </div>

    </main>

    <script src="clock.js"></script>

</body>

</html>
