<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TimeHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>TimeHub</h1>

    <button id="themeButton">
        Dark Mode
    </button>
</header>


<main>

    <!-- CLOCK -->

    <section class="card">

        <p>LIVE CLOCK</p>

        <h2 id="time">
            00:00:00
        </h2>

        <h3 id="date">
            Loading...
        </h3>

        <button id="formatButton">
            12 Hour
        </button>

    </section>


    <!-- WORLD CLOCK -->

    <section class="card">

        <p>WORLD CLOCK</p>

        <div class="world">

            <div>
                <h3>Nepal</h3>
                <span id="nepal">--:--:--</span>
            </div>

            <div>
                <h3>London</h3>
                <span id="london">--:--:--</span>
            </div>

            <div>
                <h3>New York</h3>
                <span id="newYork">--:--:--</span>
            </div>

            <div>
                <h3>Tokyo</h3>
                <span id="tokyo">--:--:--</span>
            </div>

        </div>

    </section>


    <!-- STOPWATCH -->

    <section class="card">

        <p>STOPWATCH</p>

        <h2 id="stopwatch">
            00:00:00
        </h2>

        <button id="startStopwatch">
            Start
        </button>

        <button id="resetStopwatch">
            Reset
        </button>

    </section>


    <!-- COUNTDOWN -->

    <section class="card">

        <p>COUNTDOWN</p>

        <input
            id="minutesInput"
            type="number"
            value="5"
            min="1"
        >

        <h2 id="countdown">
            05:00
        </h2>

        <button id="startCountdown">
            Start
        </button>

        <button id="resetCountdown">
            Reset
        </button>

    </section>


    <!-- STREAK -->

    <section class="card">

        <p>LEARNING STREAK</p>

        <h2>
            <span id="streak">0</span>
            Days
        </h2>

        <p id="streakMessage">
            Start your streak today.
        </p>

        <button id="completeDay">
            Complete Today
        </button>

        <div class="streak-box">

            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>

        </div>

    </section>


    <!-- TASKS -->

    <section class="card">

        <p>TASKS</p>

        <div class="task-input">

            <input
                id="taskInput"
                type="text"
                placeholder="Enter a task"
            >

            <button id="addTask">
                Add
            </button>

        </div>

        <ul id="taskList"></ul>

    </section>

</main>


<footer>

    <p>
        TimeHub
    </p>

    <p>
        Learning JavaScript every day
    </p>

</footer>


<script src="js/clock.js"></script>
<script src="js/timer.js"></script>
<script src="js/theme.js"></script>
<script src="js/worldclock.js"></script>
<script src="js/streak.js"></script>
<script src="js/tasks.js"></script>

</body>
</html>
