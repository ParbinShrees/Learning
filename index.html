<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="header">
            <h1>Digital Clock</h1>

            <button id="themeButton">Light Mode</button>
        </header>


        <!-- Clock -->
        <section class="clock-section">
            <div id="time">00:00:00</div>

            <div id="date">Loading date...</div>
        </section>


        <!-- Alarm -->
        <section class="card">
            <h2>Alarm</h2>

            <div class="input-group">
                <input type="time" id="alarmTime">

                <button id="setAlarmButton">
                    Set Alarm
                </button>
            </div>

            <p id="alarmStatus">No alarm set</p>
        </section>


        <!-- Stopwatch -->
        <section class="card">
            <h2>Stopwatch</h2>

            <div id="stopwatchDisplay">
                00:00:00
            </div>

            <div class="buttons">
                <button id="startStopwatch">Start</button>
                <button id="pauseStopwatch">Pause</button>
                <button id="resetStopwatch">Reset</button>
            </div>
        </section>


        <!-- Timer -->
        <section class="card">
            <h2>Countdown Timer</h2>

            <div class="input-group">
                <input
                    type="number"
                    id="timerMinutes"
                    placeholder="Minutes"
                    min="1"
                >

                <button id="startTimer">
                    Start Timer
                </button>
            </div>

            <div id="timerDisplay">
                00:00
            </div>

            <div class="buttons">
                <button id="pauseTimer">Pause</button>
                <button id="resetTimer">Reset</button>
            </div>
        </section>

    </main>


    <!-- JavaScript files -->
    <script src="clock.js"></script>
    <script src="alarm.js"></script>
    <script src="stopwatch.js"></script>
    <script src="timer.js"></script>
    <script src="theme.js"></script>

</body>
</html>
